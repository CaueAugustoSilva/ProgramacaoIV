<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 01</title>
    <link rel="stylesheet" href="estilos.css"> 
</head>
<body>
    <div class="container">
        <img class="imagem" src="logo ifrj.png" alt="Logo IFRJ">
        <div class="info">
            <p>Agora o acesso é feito com o seu <strong>CPF</strong> + <strong>senha</strong>.</p>
        </div>
        <div class="meio">
            <input type="text" placeholder="CPF (só números)" name="cpf">
            <input type="password" placeholder="Senha" name="senha">
            <button type="submit">Confirmar</button>
        </div>
        <div class="outros">
            <a href="#">Esqueci minha Senha</a>
            <a href="#">Esqueci o E-mail Cadastrado</a>
            <a href="#">Sou responsável - primeiro acesso</a>
        </div>

    </div>
</body>
</html>
